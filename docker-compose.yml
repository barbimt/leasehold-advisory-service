services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: leasehold
      POSTGRES_USER: leasehold
      POSTGRES_PASSWORD: leasehold
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U leasehold -d leasehold']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
